name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  packages:
    name: packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      # `yarn run <script>` needs an existing install to run at all, so the bootstrap install
      # cannot live inside `verify` alone — it is repeated here, where it is a no-op second time.
      - run: yarn install --immutable
      # One script, so `yarn verify` locally is the same thing this lane runs — including the
      # ordering (`generate` between two builds: the sandbox registry comes from the packages'
      # dist, and typecheck then reads what generate produced).
      - run: yarn verify

  harness:
    name: harness (${{ matrix.transport }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        transport: [memory, bullmq, pgboss]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: durable_harness
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DURABLE_TRANSPORT: ${{ matrix.transport }}
      HARNESS_PG_URL: postgres://postgres:postgres@localhost:5432/durable_harness
      HARNESS_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build:packages
      - run: yarn test:harness

  e2e-sandbox:
    name: e2e (sandbox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build:packages
      # No __integration__ specs exist before phase 6, and the ephemeral runner exits 1 on
      # "no tests found" — so booting a whole app to discover that is 6 wasted minutes.
      # This turns itself on the moment the first spec lands.
      - id: specs
        run: |
          set -euo pipefail
          # A boolean, not a count: `wc -l` pads its output on some platforms, and a padded
          # "0" is a non-empty string that would quietly defeat the `if:` below.
          if [ -n "$(find packages -path '*/__integration__/TC-*.spec.ts' -print -quit)" ]; then
            echo 'found=true' >> "$GITHUB_OUTPUT"
          else
            echo 'found=false' >> "$GITHUB_OUTPUT"
            echo '::notice::No __integration__ specs yet — skipping the e2e lane.'
          fi
      # The OM ephemeral runner brings up its own Postgres and app via testcontainers.
      # The durable worker is hosted in-process here; failure injection lives in harness/.
      # The runner builds and starts the app in PRODUCTION mode, where core refuses to boot
      # on the placeholder secrets .env.example ships. Generate real ones for this run.
      - if: steps.specs.outputs.found == 'true'
        run: ./scripts/sandbox-env.sh --force
      - if: steps.specs.outputs.found == 'true'
        run: yarn workspace sandbox exec playwright install --with-deps chromium
      - if: steps.specs.outputs.found == 'true'
        run: yarn test:integration:ephemeral
        env:
          DURABLE_WORK_INPROCESS_WORKER: '1'
          # The full OM app build is memory-hungry; the default runner heap is not enough.
          NODE_OPTIONS: --max-old-space-size=6144
      - uses: actions/upload-artifact@v4
        if: failure() && steps.specs.outputs.found == 'true'
        with:
          name: playwright-report
          path: |
            apps/sandbox/playwright-report
            apps/sandbox/test-results
          retention-days: 7

  compat:
    name: compat (${{ matrix.channel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [latest, develop]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - run: yarn install
      - run: yarn platform:sync --channel ${{ matrix.channel }}
      - run: yarn install --no-immutable
      # Regenerated against the channel's core. A diff here is information, not a failure:
      # a newer core legitimately mirrors differently, and that is what a per-core-minor
      # release of data-sync-durable exists for (ADR 0006). What must not break is the
      # build and the tests below — including the mirror-shape contract.
      - run: yarn gen:mirror
      - name: Report mirror drift against this channel
        run: |
          git diff --stat -- packages/data-sync-durable > drift.txt || true
          if [ -s drift.txt ]; then
            { echo "### Mirror drift on \`${{ matrix.channel }}\`"; echo '```'; cat drift.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: yarn build:packages
      - run: yarn workspace sandbox generate
      - run: yarn typecheck
      - run: yarn test
