name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly, for the install lane — the one check that needs the packages packed and
    # reinstalled rather than linked.
    - cron: '0 3 * * *'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  packages:
    name: packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      # `yarn run <script>` needs an existing install to run at all, so the bootstrap install
      # cannot live inside `verify` alone — it is repeated here, where it is a no-op second time.
      - run: yarn install --immutable
      # One script, so `yarn verify` locally is the same thing this lane runs — including the
      # ordering (`generate` between two builds: the sandbox registry comes from the packages'
      # dist, and typecheck then reads what generate produced).
      - run: yarn verify

  harness:
    name: harness (${{ matrix.transport }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        transport: [memory, bullmq, pgboss]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: durable_harness
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DURABLE_TRANSPORT: ${{ matrix.transport }}
      HARNESS_PG_URL: postgres://postgres:postgres@localhost:5432/durable_harness
      HARNESS_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build:packages
      - run: yarn test:harness

  e2e-sandbox:
    name: e2e (sandbox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build:packages
      # No __integration__ specs exist before phase 6, and the ephemeral runner exits 1 on
      # "no tests found" — so booting a whole app to discover that is 6 wasted minutes.
      # This turns itself on the moment the first spec lands.
      - id: specs
        run: |
          set -euo pipefail
          # A boolean, not a count: `wc -l` pads its output on some platforms, and a padded
          # "0" is a non-empty string that would quietly defeat the `if:` below.
          if [ -n "$(find packages -path '*/__integration__/TC-*.spec.ts' -print -quit)" ]; then
            echo 'found=true' >> "$GITHUB_OUTPUT"
          else
            echo 'found=false' >> "$GITHUB_OUTPUT"
            echo '::notice::No __integration__ specs yet — skipping the e2e lane.'
          fi
      # The OM ephemeral runner brings up its own Postgres and app via testcontainers.
      # The durable worker is hosted in-process here; failure injection lives in harness/.
      # The runner builds and starts the app in PRODUCTION mode, where core refuses to boot
      # on the placeholder secrets .env.example ships. Generate real ones for this run.
      - if: steps.specs.outputs.found == 'true'
        run: ./scripts/sandbox-env.sh --force
      - if: steps.specs.outputs.found == 'true'
        run: yarn workspace sandbox exec playwright install --with-deps chromium
      - if: steps.specs.outputs.found == 'true'
        run: yarn test:integration:ephemeral
        env:
          DURABLE_WORK_INPROCESS_WORKER: '1'
          # The full OM app build is memory-hungry; the default runner heap is not enough.
          NODE_OPTIONS: --max-old-space-size=6144
      - uses: actions/upload-artifact@v4
        if: failure() && steps.specs.outputs.found == 'true'
        with:
          name: playwright-report
          path: |
            apps/sandbox/playwright-report
            apps/sandbox/test-results
          retention-days: 7

  compat:
    name: compat (${{ matrix.channel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [latest, develop]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - run: yarn install
      - run: yarn platform:sync --channel ${{ matrix.channel }}
      - run: yarn install --no-immutable
      # Regenerated against the channel's core. A diff here is information, not a failure:
      # a newer core legitimately mirrors differently, and that is what a per-core-minor
      # release of data-sync-durable exists for (ADR 0006). What must not break is the
      # build and the tests below — including the mirror-shape contract.
      - run: yarn gen:mirror
      - name: Report mirror drift against this channel
        run: |
          git diff --stat -- packages/data-sync-durable > drift.txt || true
          if [ -s drift.txt ]; then
            { echo "### Mirror drift on \`${{ matrix.channel }}\`"; echo '```'; cat drift.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: yarn build:packages
      - run: yarn workspace sandbox generate
      - run: yarn typecheck
      - run: yarn test

  install:
    name: install lane (${{ matrix.channel }})
    # Nightly and before a release. Everything else tests the workspace link; this is the only
    # lane that tests what npm would actually ship, and it is slow enough not to belong on
    # every push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [latest, develop]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - run: yarn install
      - run: yarn platform:sync --channel ${{ matrix.channel }}
      - run: yarn install --no-immutable
      - run: ./scripts/install-lane.sh ${{ matrix.channel }}

  release:
    name: release
    # Every green merge to main releases. The version comes from the conventional commits since
    # the last tag, both packages publish at it, and a merge of only chore/docs/refactor/test
    # commits releases nothing. See .releaserc.md.
    needs: [packages, harness, e2e-sandbox, compat]
    # The repository variable is the switch, and it stays off until each package has been
    # published once by hand. npm cannot create a package over OIDC — a trusted publisher can
    # only be configured on one that already exists — so until that is done every automated
    # release would fail, and a permanently red pipeline is how people learn to ignore it.
    # See .releaserc.md for the one-time setup; flip the variable at the end of it.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.NPM_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the version commit, the tag, the GitHub release
      issues: write # release comments
      pull-requests: write # release comments
      id-token: write # npm trusted publishing, and provenance on the artifact
      # The permission alone is not enough: only @semantic-release/npm v13+ knows to mint a
      # token from it. Older majors go straight to `npm whoami`, which needs a token that does
      # not exist here, and fail in verifyConditions before reading a single commit. That is why
      # the semantic-release pin is a major range, not a caret over whatever installs.
      #
      # The npm side matters too, and cost a day: a trusted publisher defaults to *staged*
      # publishing only, and a direct `npm publish` is then refused with "OIDC permission denied
      # for this action" — after the token exchange has already succeeded, which reads like a
      # misconfigured publisher and is not one. The error is literal: the publisher is fine, the
      # *action* was not allowed. "Allow npm publish" on the package's trusted publisher is the
      # box that permits it.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release reads the whole history and every tag
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      # OIDC publishing needs a recent npm; the runner's bundled one may predate it.
      - run: npm install -g npm@latest
      - run: yarn install --immutable
      # Run here rather than as a `needs:` dependency: the install lane is skipped on push, and
      # a release is precisely the moment "does the shape npm would ship actually work?" has to
      # be answered. Failing here costs a red build; failing after publishing costs a version
      # number that can never be reused.
      - run: ./scripts/install-lane.sh latest
      - run: yarn semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

