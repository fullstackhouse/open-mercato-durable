compressionLevel: mixed
enableTelemetry: false
nodeLinker: node-modules
npmRegistryServer: "https://registry.npmjs.org"
npmPublishRegistry: "https://registry.npmjs.org"

# Yarn 4.17 quarantines versions younger than npmMinimalAgeGate (default 1 day).
# The sandbox pins exact @open-mercato releases that are often minutes old, and
# platform:sync --channel develop moves to the newest develop build on purpose.
npmPreapprovedPackages:
  - "@open-mercato/*"
